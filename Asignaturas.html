<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Antonio">
		<meta name="copyright" content="AVM">
    </head>
    <body>
        <h2>Formulario de Asignaturas</h2>
        <form action="" method="get">
            <section>
                <!--Asignatura-->
                <input type="checkbox" id="BBDD" name="asignatura" value="BBDD" required>
			    <label for="BBDD">BBDD</label><br>

                <input type="checkbox" id="PRO" name="asignatura" value="PRO" required>
			    <label for="PRO">PRO</label><br>

                <input type="checkbox" id="INT" name="asignatura" value="INT" required>
			    <label for="INT">INT</label><br>

                <input type="checkbox" id="EEDD" name="asignatura" value="EEDD" required>
			    <label for="EEDD">EEDD</label><br><br>
            </section>
            <section>
                <!--Profesor-->
                <label for="Correo" class="texto">Correo</label><br>
                <input type="text" id="Correo" name="Correo" required>
            </section>
            <section>
                <!--Horas-->
                <label for="horas" class="texto">Horas</label><br>
                <input type="number" id="horas" name="horas" min="1" required>
            </section>
            <section>
                <!--Informacion-->
                <label for="informacion" class="TextArea">Informacion</label><br>
                <input type="informacion" id="informacion" name="informacion" rows="4" cols="50" required>
            </section>
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>
